name: ServiceDesk CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & QA Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Automated Tests (JUnit 5 & Mockito)
        run: mvn clean test --batch-mode

      - name: Package Spring Boot Application JAR
        run: mvn package -DskipTests=true --batch-mode

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

      - name: Archive Executable Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: servicedesk-application-jar
          path: target/servicedesk-*.jar
